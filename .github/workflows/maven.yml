name: CI for Dev Branch

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run TestNG Suite
        run: ./gradlew clean test

      - name: Display Test Results (if any)
        run: |
          echo "Checking for XML reports..."
          find . -type f -name "*.xml" | grep test-results || echo "No test result XML files found"
